<!DOCTYPE html>
<html lang="kk"><head><meta charset="utf-8"><title>Let's Learn English!</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;700&subset=cyrillic,cyrillic-ext&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:'Lora',Georgia,'Times New Roman',serif;font-size:19px;color:#2d3250;background:#e8f6ff;min-height:100vh}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:2.1rem;margin:.2em 0;text-align:center}
h2{margin:.2em 0}
.card{background:#fff;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.btn{font:inherit;font-weight:700;border:0;border-radius:16px;padding:10px 18px;cursor:pointer;background:#ff8a3d;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.alt{background:#4a90e2}.btn.green{background:#3cb371}.btn.pink{background:#e8558a}
.lang{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:12px}
.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.topic{border-radius:20px;padding:16px;text-align:center}
.topic .em{font-size:2.6rem}
.topic .btn{margin-top:8px}
.words{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.word{border-radius:18px;padding:12px;text-align:center;font-weight:700;border:3px solid rgba(0,0,0,.1)}
.dot{width:46px;height:46px;border-radius:50%;margin:0 auto 6px;border:3px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.word small{display:block;font-weight:500}
.word button{margin-top:6px;font:inherit;border:0;background:#fff;border-radius:12px;padding:4px 12px;cursor:pointer}
.game{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.sw{width:82px;height:82px;border-radius:50%;border:5px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:2.4rem}
.chat{background:#f4f0ff;border-radius:18px;padding:12px;min-height:110px;max-height:300px;overflow:auto}
.msg{margin:6px 0;padding:8px 12px;border-radius:14px;max-width:88%}
.bot{background:#fff}.me{background:#c9e7ff;margin-left:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.nav{justify-content:space-between;margin:18px 0}
input{font:inherit;padding:10px 14px;border-radius:14px;border:3px solid #cbb8ff;flex:1;min-width:150px}
.hide{display:none}
</style></head>
<body>
<button class="btn alt lang" id="langBtn"></button>

<div id="home" class="wrap">
  <h1 id="hTitle"></h1>
  <div class="card" id="about"></div>
  <div style="text-align:center"><button class="btn pink" id="aboutBtn"></button></div>
  <div class="card hide" id="aboutProj"></div>
  <div class="topics" id="topics"></div>
</div>

<div id="col" class="wrap hide">
  <h1 id="cTitle"></h1>
  <div class="card"><h2 id="vTitle"></h2><div class="words" id="words"></div></div>
  <div class="card"><h2 id="gTitle"></h2><p id="gQ" style="font-size:1.3rem;font-weight:700"></p><div class="game" id="game"></div><p id="gScore"></p></div>
  <div class="card"><h2 id="aTitle"></h2>
    <div class="row" id="btns"></div>
    <div class="chat" id="chat"></div>
    <div class="row"><input id="inp"><button class="btn green" id="send"></button></div>
  </div>
  <div class="row nav"><button class="btn alt" id="toHome"></button><button class="btn green" id="toNext"></button></div>
</div>

<footer id="foot" style="text-align:center;padding:18px 16px;font-size:.9rem"></footer>

<script>
// [emoji, EN, KK, page bg, card bg, words "en|kk|visual~...", tasks "question|kk|answer(s)|example~..."]
const TP=[
["🎨","Colours","Түстер","#fff7d6","#ffe9a8",
"red|қызыл|#ff4d4d~blue|көк|#3d8bff~yellow|сары|#ffd93d~green|жасыл|#3cb371~orange|қызғылт сары|#ff9a3d~pink|қызғылт|#ff8fc0~purple|күлгін|#9b59b6~black|қара|#333~white|ақ|#fff",
"What colour is the sun?|Күн қандай түсті?|yellow|The banana is yellow.~What colour is grass?|Шөп қандай түсті?|green|The frog is green.~What colour is the sky?|Аспан қандай түсті?|blue|The sea is blue.~What colour is a tomato?|Қызанақ қандай түсті?|red|The apple is red.~What colour is snow?|Қар қандай түсті?|white|The milk is white.~What colour is a grape?|Жүзім қандай түсті?|purple|The plum is purple.~What colour is a pig?|Шошқа қандай түсті?|pink|The flower is pink.~What colour is an orange?|Апельсин қандай түсті?|orange|The carrot is orange.~What colour is the night?|Түн қандай түсті?|black|The cat is black."],
["🌦️","Seasons and weather","Жыл мезгілдері және ауа райы","#dff3ff","#bfe6ff",
"spring|көктем|🌸~summer|жаз|☀️~autumn|күз|🍂~winter|қыс|⛄~sunny|күнді|🌞~rainy|жаңбырлы|🌧️~snowy|қарлы|❄️~windy|желді|💨~cloudy|бұлтты|☁️",
"It is hot. We swim in the river. Which season?|Ыстық. Біз өзенде жүземіз. Қай мезгіл?|summer|In winter it is cold.~It is cold. We play with snow. Which season?|Суық. Біз қармен ойнаймыз. Қай мезгіл?|winter|In summer it is hot.~Flowers grow. Birds come back. Which season?|Гүлдер өседі. Құстар қайтады. Қай мезгіл?|spring|In autumn leaves fall.~Leaves fall from the trees. Which season?|Ағаштан жапырақ түседі. Қай мезгіл?|autumn|In spring flowers grow.~Water falls from the clouds. Weather?|Бұлттан су түседі. Ауа райы қандай?|rainy/rain|It is sunny today.~The sun is shining. Weather?|Күн жарқырап тұр. Ауа райы қандай?|sunny/sun|It is snowy today.~Snow is falling. Weather?|Қар жауып тұр. Ауа райы қандай?|snowy/snow|It is rainy today.~The wind blows the kite. Weather?|Жел батпырауықты ұшырады. Ауа райы қандай?|windy/wind|It is cloudy today."],
["🚌","Transport","Көлік","#ffe5e5","#ffc9c9",
"bus|автобус|🚌~car|көлік|🚗~train|пойыз|🚆~plane|ұшақ|✈️~ship|кеме|🚢~bike|велосипед|🚲~taxi|такси|🚕~helicopter|тікұшақ|🚁",
"It flies in the sky. It has wings.|Ол аспанда ұшады. Қанаты бар.|plane|The bird can fly.~It goes on water.|Ол суда жүзеді.|ship/boat|The fish lives in water.~It goes on rails.|Ол рельспен жүреді.|train|The train is long.~It has two wheels. You pedal it.|Оның екі дөңгелегі бар. Педаль басасың.|bike/bicycle|I like my bike.~Children go to school by this big vehicle.|Балалар мектепке осы үлкен көлікпен барады.|bus|I go by bus.~It has four wheels. Dad drives it.|Оның төрт дөңгелегі бар. Әкем айдайды.|car|The car is red.~It is a yellow city car with a driver.|Бұл жүргізушісі бар сары қала көлігі.|taxi|The taxi is yellow.~It flies and has big blades on top.|Ол ұшады, үстінде үлкен қалақтары бар.|helicopter|The helicopter can fly."],
["🍎","Healthy food","Пайдалы тағам","#e6f9dc","#c9f0b8",
"apple|алма|🍎~banana|банан|🍌~carrot|сәбіз|🥕~milk|сүт|🥛~bread|нан|🍞~fish|балық|🐟~egg|жұмыртқа|🥚~water|су|💧",
"Rabbits love this orange vegetable.|Қояндар осы қызғылт сары көкөністі жақсы көреді.|carrot|I eat an apple.~It is a yellow fruit. Monkeys love it.|Бұл сары жеміс. Маймылдар жақсы көреді.|banana|I like milk.~A cow gives us this white drink.|Сиыр бізге осы ақ сусынды береді.|milk|I drink water.~A hen gives us this.|Тауық бізге осыны береді.|egg|I eat bread.~We drink it every day. It has no colour.|Біз оны күнде ішеміз. Оның түсі жоқ.|water|The carrot is healthy.~We eat it with soup. It is made from flour.|Оны көже, сорпамен жейміз. Ұннан жасалады.|bread|I like fish.~It lives in the sea. We can eat it.|Ол теңізде тұрады. Оны жеуге болады.|fish|The banana is yellow.~A red fruit. One a day keeps the doctor away.|Қызыл жеміс. Күніне біреуі дәрігерден сақтайды.|apple|The egg is white."],
["🖐️","Body parts","Дене мүшелері","#f0e6ff","#dfccff",
"head|бас|🙂~eyes|көз|👀~ears|құлақ|👂~nose|мұрын|👃~mouth|ауыз|👄~hand|қол|✋~leg|аяқ|🦵~teeth|тіс|🦷",
"We see with our...|Біз ... көреміз.|eye|I hear with my ears.~We hear with our...|Біз ... естиміз.|ear|I see with my eyes.~We smell with our...|Біз ... иіскейміз.|nose|I eat with my mouth.~We eat with our...|Біз ... жейміз.|mouth|I smell with my nose.~We write with our...|Біз ... жазамыз.|hand|I walk with my legs.~We walk with our...|Біз ... жүреміз.|leg|I write with my hand.~We brush them every morning.|Біз оларды күнде таңертең тазалаймыз.|teeth/tooth|I have two eyes.~We put a hat on our...|Біз бас киімді ... киеміз.|head|I have two ears."],
["👕","Clothes","Киім","#ffe6f3","#ffcce6",
"shirt|жейде|👕~dress|көйлек|👗~cap|кепка|🧢~shoes|аяқ киім|👟~socks|шұлық|🧦~jacket|күртеше|🧥~trousers|шалбар|👖~scarf|орамал|🧣",
"We wear them on our feet inside shoes.|Оларды аяққа, аяқ киімнің ішіне киеміз.|sock|I wear shoes.~It is warm. We wear it around the neck.|Ол жылы. Мойынға тоқылады.|scarf|I wear a cap.~Girls wear this pretty clothes.|Қыздар осы әдемі киімді киеді.|dress|I wear a shirt.~We wear it on the head. It is against the sun.|Оны басқа киеміз. Күннен қорғайды.|cap/hat|I wear socks.~We wear them on our feet to walk outside.|Оларды далада жүру үшін аяққа киеміз.|shoe|I wear a jacket.~It is a warm coat for winter.|Бұл қыстағы жылы киім.|jacket/coat|I wear a dress.~We wear it on our legs. It has two legs.|Оны аяққа киеміз. Оның екі қалтасы бар.|trouser/pant|I wear a scarf.~We wear it on top. A T-... .|Оны үстіне киеміз. Футболка.|shirt|I wear trousers."]
];
const T={kk:{title:"Ағылшын тілін бірге үйренейік!",about:"Сәлем! Бұл сайтта ағылшын тілін ойнап, ЖИ-көмекшімен бірге үйренеміз. Көмекші саған дайын жауап бермейді, тек қолғабыс (подсказка) береді!",aboutBtn:"ℹ️ Жоба туралы",aboutTxt:"Бұл сайт «Зерде» республикалық зерттеу жобалары конкурсына дайындалған. Оны 8-сынып оқушылары мен мұғалімі бірге жасады. Мақсаты: бастауыш сынып оқушыларына ағылшын тілін ойын арқылы үйрету және жасанды интеллектті дұрыс пайдалануға баулу. ЖИ-көмекші дайын жауап бермей, подсказка беру арқылы үйретеді.",authors:"Жоба авторлары: 8-сынып оқушылары Базарбай Асылай, Жалғасбай Алтын<br>Жетекшісі: Сағладинова Ақжібек<br>«Зерде» конкурсы · 2026",go:"Бастау ▶",home:"⬅️ Басты бетке оралу",next:"Келесі тақырыпқа өту ➡️",lang:"English",v:"📖 Жаңа сөздер",g:"🎮 Ойын: тап!",a:"🤖 Көмекші",find:"Қайсысы:",score:"Ұпай:",again:"Тағы байқап көр! 🙂",ph:"Жауабыңды жаз...",send:"Жіберу",btn:["Task · Тапсырма","Example · Мысал","Help · Көмек","Check · Тексеру"],hi:"Сәлем! «Task» батырмасын бас, тапсырма аласың.",noTask:"Алдымен «Task» батырмасын бас.",ok:["Тамаша! 🌟 Дұрыс!","Жарайсың! 🎉","Керемет! 👏"],ex:"Мысал:",check:"Өз сөйлемің жаз да жіберу батырмасын бас, мен тексеремін.",think:"Ойланып жатырмын...",cheat:"📝 Шпаргалка:",starts:"Жауап мына әріптен басталады:",letters:"әріп",sysL:"Kazakh",sen:"Тапсырма бітті, енді өз сөйлемің жаз!"},
en:{title:"Let's learn English together!",about:"Hi! Here we learn English by playing and chatting with an AI helper. The helper never gives the answer, it only gives hints!",aboutBtn:"ℹ️ About the project",aboutTxt:"This website was prepared for the “Zerde” national research project competition. It was created by 8th-grade students together with their teacher. Goal: to teach English to primary school pupils through games and to help them use artificial intelligence wisely. The AI helper gives hints instead of ready answers.",authors:"Project authors: 8th-grade students Bazarbay Assylay, Zhalgasbay Altyn<br>Supervisor: Sagladinova Akzhibek<br>“Zerde” competition · 2026",go:"Start ▶",home:"⬅️ Back to Home",next:"Next topic ➡️",lang:"Қазақша",v:"📖 New words",g:"🎮 Game: find it!",a:"🤖 Helper",find:"Which one is",score:"Score:",again:"Try again! 🙂",ph:"Type your answer...",send:"Send",btn:["Task · Тапсырма","Example · Мысал","Help · Көмек","Check · Тексеру"],hi:"Hi! Press “Task” to get a question.",noTask:"Press “Task” first.",ok:["Great! 🌟 Correct!","Well done! 🎉","Super! 👏"],ex:"Example:",check:"Write your own sentence and press send, I will check it.",think:"Thinking...",cheat:"📝 Cheat sheet:",starts:"The answer starts with:",letters:"letters",sysL:"English"}};
let L="kk",cur=-1,ti=-1,tries=0,score=0,target=null,sample=null,W=[],K=[];
const $=id=>document.getElementById(id);
const say=(t,c)=>{const d=document.createElement("div");d.className="msg "+c;d.textContent=t;$("chat").appendChild(d);$("chat").scrollTop=1e9};
const sp=j=>{try{const u=new SpeechSynthesisUtterance(W[j][0]);u.lang="en-US";u.rate=.8;speechSynthesis.speak(u)}catch(e){}};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>a.slice().sort(()=>Math.random()-.5);
const vis=v=>v[0]=="#"?`<div class="dot" style="background:${v}"></div>`:`<div style="font-size:2.4rem">${v}</div>`;
function render(){const t=T[L];document.documentElement.lang=L;
 $("langBtn").textContent=t.lang;$("hTitle").textContent="🌈 "+t.title;$("about").textContent=t.about;
 $("aboutBtn").textContent=t.aboutBtn;$("aboutProj").textContent=t.aboutTxt;$("foot").innerHTML=t.authors;
 $("topics").innerHTML=TP.map((x,i)=>`<div class="topic" style="background:${x[4]}"><div class="em">${x[0]}</div><b>${x[1]}</b><br><small>${x[2]}</small><br><button class="btn" onclick="openT(${i})">${t.go}</button></div>`).join("");
 if(cur>=0)renderT()}
function renderT(){const t=T[L],p=TP[cur];
 $("cTitle").textContent=p[0]+" "+p[1]+" · "+p[2];
 $("vTitle").textContent=t.v;$("gTitle").textContent=t.g;$("aTitle").textContent=t.a;
 $("words").innerHTML=W.map((w,j)=>`<div class="word" style="background:${p[4]}88">${vis(w[2])}${w[0]}<small>${w[1]}</small><button onclick="sp(${j})">🔊</button></div>`).join("");
 $("inp").placeholder=t.ph;$("send").textContent=t.send;$("toHome").textContent=t.home;$("toNext").textContent=t.next;
 $("btns").innerHTML=t.btn.map((b,i)=>`<button class="btn ${['','alt','pink','green'][i]}" onclick="act(${i})">${b}</button>`).join("");
 newQ()}
function openT(i){cur=i;const p=TP[i];W=p[5].split("~").map(x=>x.split("|"));K=p[6].split("~").map(x=>x.split("|"));
 ti=-1;tries=0;score=0;$("chat").innerHTML="";say(T[L].hi,"bot");
 $("home").classList.add("hide");$("col").classList.remove("hide");document.body.style.background=p[3];renderT();scrollTo(0,0)}
function goHome(){cur=-1;$("col").classList.add("hide");$("home").classList.remove("hide");document.body.style.background="";scrollTo(0,0)}
function newQ(){target=pick(W);$("gQ").textContent=T[L].find+" "+(L=="kk"?target[1]:target[0])+"?";$("gScore").textContent=T[L].score+" "+score;
 $("game").innerHTML=shuf(shuf(W.filter(w=>w!=target)).slice(0,3).concat([target])).map(w=>{const c=w[2][0]=="#";return `<div class="sw" style="background:${c?w[2]:'#fff'}" onclick="guess(${W.indexOf(w)})">${c?'':w[2]}</div>`}).join("")}
function guess(j){if(W[j]==target){score++;sp(j);newQ()}else $("gScore").textContent=T[L].again}
const alts=()=>K[ti][2].split("/");
function cheat(){const a=alts()[0],t=T[L];say(t.cheat+" "+t.starts+" “"+a[0]+"” ("+a.length+" "+t.letters+")","bot")}
function act(i){const t=T[L];
 if(i==0){ti=(ti+1)%K.length;tries=0;say(K[ti][0]+"  ("+K[ti][1]+")","bot")}
 else if(i==1){if(ti<0)return say(t.noTask,"bot");say(t.ex+" "+K[ti][3],"bot")}
 else if(i==2){if(ti<0)return say(t.noTask,"bot");cheat()}
 else say(t.check,"bot")}
async function ai(prompt){
 if(!sample)return null;
 try{const r=await sample("You are a friendly English helper for 8-9 year old Kazakh children learning the topic \""+TP[cur][1]+"\". Reply in "+T[L].sysL+" plus simple English examples. Max 2 short sentences. Never reveal the exact answer to the current question. Never mention websites or ask personal information. Stay on the topic. Be kind.\n\n"+prompt,{modelTier:"quick",cache:false});return r.text}catch(e){return null}}
async function send(){const v=$("inp").value.trim();if(!v)return;$("inp").value="";say(v,"me");const t=T[L],lv=v.toLowerCase();
 const sent=ti<0||lv.split(" ").length>4&&!alts().some(a=>lv==a);
 if(ti>=0&&alts().some(a=>lv.includes(a))){say(pick(t.ok),"bot");tries=0;return}
 if(ti<0){say(t.think,"bot");const r=await ai("The child wrote a sentence: \""+v+"\". Check it: if correct praise them, if not gently show how to fix it with a short example.");$("chat").lastChild.textContent=r||(W.some(w=>lv.includes(w[0]))?pick(t.ok):t.ex+" "+K[0][3]);return}
 tries++;
 if(tries==1){say(t.think,"bot");const r=await ai("Question: \""+K[ti][0]+"\". The child answered wrongly: \""+v+"\". Give a hint with an example about a DIFFERENT thing, like \""+K[ti][3]+"\". Do not say the answer.");$("chat").lastChild.textContent=r||(t.ex+" "+K[ti][3]+" 🙂")}
 else cheat()}
$("send").onclick=send;$("inp").onkeydown=e=>{if(e.key=="Enter")send()};
$("aboutBtn").onclick=()=>$("aboutProj").classList.toggle("hide");
$("langBtn").onclick=()=>{L=L=="kk"?"en":"kk";render()};
$("toHome").onclick=goHome;$("toNext").onclick=()=>cur<TP.length-1?openT(cur+1):goHome();
render();
try{window.claude&&claude.use("sample").then(s=>{sample=s})}catch(e){}
</script></body></html>
